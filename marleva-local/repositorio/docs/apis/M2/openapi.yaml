    get:
      operationId: MAR_M2_API_011
      tags:
        - M2
      summary: Leer documento con permiso vigente
      description: "Reautorizar sesión/actor y permiso exacto; si revisor, capacidad/asignación/MFA
        recientes. Revalidar privacidad/estado y autorización antes de responder tras verificar
        MIME, tamaño y hash fuera de bloqueos. Sin redirección ni URL firmada pública, no
        Range/caché/descarga masiva. Servir máximo 5.000.000 bytes con no-store, nosniff y
        attachment filename=documento sin datos personales. Permiso no reemplaza sesión. Bytes ya
        entregados no se revocan. La autorización admite también la ruta tipada
        restrictionAssignmentId/restrictionAppealId: exigir enlace exacto, concesión restrict
        actual, asignación vigente y MFA; nunca basta conocer el token. Revalidar al servir bytes."
      x-use-case-id: MAR-M2-UC-002
