  /v1/m2/membership-applications/{application_id}/versions/{version_id}:
    put:
      operationId: MAR_M2_API_004
      tags:
        - M2
      summary: Guardar todos los campos del borrador
      description: "PUT reemplaza campos del borrador actual con CAS de expediente. Estados permitidos:
        draft para initial, correction para origin correction, rejected para reconsideration. No
        modificar versión enviada. reconsideration_reason obligatorio y no vacío si origin
        reconsideration; null para initial/correction. Unicode NFC y trim, campos vacíos se
        rechazan. No recibe estado, identidad, origen o antecedente modificables. Declaración
        vecinal actual debe confirmarse de nuevo. Motivo se puede ajustar en borrador, se congela al
        enviar. También versiones residence_change/reopen actuales editables; origen efectivo
        resume_origin controla motivo si corresponde. Archivo no permite guardar o enviar hasta
        reapertura válida."
