  /v1/m2/membership-documents/{document_id}/content:
    put:
      operationId: MAR_M2_API_006
      tags:
        - M2
      summary: Cargar bytes una sola vez
      description: "Sesión actual y permiso de carga en cabecera; ruta mediada propia, nunca Storage
        público. Solo objeto pendiente y no enlazado. PUT repetido admite exclusivamente mismos
        bytes/hash tras comprobación, sin sobrescritura. Vencido ->409; tipo no declarado ->415;
        tamaño distinto/mayor ->422/413. MIME real se determina al finalizar. Sin CommandReceipt:
        transferencia idempotente separada del comando de reserva."
