                const: deleted
          then:
            properties:
              completed_at:
                type: string
                format: date-time
              schedule_status:
                const: complete
          else:
            properties:
              completed_at:
                type: "null"
        - if:
            properties:
              state:
                const: uncalculated
          then:
            properties:
              planned_deletion_at:
                type: "null"
              schedule_status:
                const: not_calculated
        - if:
            properties:
              state:
                const: held
          then:
            properties:
              schedule_status:
                const: blocked
        - if:
            properties:
              state:
                const: scheduled
          then:
            properties:
              planned_deletion_at:
                type: string
                format: date-time
              schedule_status:
                const: planned
        - if:
            properties:
              state:
                const: error
          then:
            properties:
              schedule_status:
                const: delayed
        - if:
            properties:
