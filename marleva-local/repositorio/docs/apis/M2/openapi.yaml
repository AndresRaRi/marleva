openapi: 3.1.1
info:
  title: Marleva M2 y soporte M8 — expediente y revisión
  version: 0.4.0
  description: Diseño documental integral de M2, UC001-011, y soporte M8 UC001-005. Pertenencia,
    oferentes, restricciones, conservación y elegibilidad. Sin implementación, migraciones aplicadas
    ni contratos compartidos modificados.
servers:
  - url: https://marleva-documentacion.invalid
    description: Dominio reservado no operativo. No configurar un servidor real en este corte.
tags:
  - name: M2
    description: Expediente y evidencia privada
  - name: M8
    description: Asignación y revisión vecinal
security:
  - cookieSession: []
  - mobileSession: []
x-contract-status: designed_only
x-data-model: MAR-M2-DATA-001
x-global-rules:
  - Todas las rutas propuestas bajo /v1/m2 o /v1/m8; sin bundle/rutas/tipos M1 compartidos.
  - Sin body/query/campos desconocidos ni parámetros repetidos; 422. JSON mal formado 400. Cuerpo
    JSON máximo 16384 bytes UTF-8, exceso 413.
  - Todas las respuestas no-store; IDs no autorizan; no credenciales/PII en URL/logs.
  - "Cookie web y Bearer móvil son alternativas excluyentes. M1 provee identidad/sesión/CSRF/MFA:
    interfaz de integración aún por acordar, sin escribir sus tablas."
  - "Idempotencia: autenticar/autorizar antes de lookup, buscar actor+operación+clave antes de
    precondiciones de transición; mismo cuerpo devuelve recibo mínimo original, no estado viejo."
  - Huella HMAC canónica incluye método,ruta,IDs y cuerpo normalizado incluidos expected_revision;
    misma clave con huella distinta409; clave no logueada.
  - Retención recibo >=72h. En vuelo409 COMMAND_IN_PROGRESS; cliente consulta y reintenta misma
    clave tras espera, sin nuevo efecto.
  - No se guardan secretos de permisos en recibo. Permisos nuevos revalidan sesión/estado, no se
    repiten ciegamente.
  - Después de expiración consultar recurso; nunca reintentar automáticamente mutación con clave
    nueva. Identidad expediente/envío/decisión únicos sobrevive recibo.
  - Capacidades M8 revocables específicas, no RoleKey ni Account.operator. Gestión de concesiones y
    coordinación con M1 pendientes.
  - result_revision en recibo es la revision resultante del expediente. Reserva, finalización
    terminal, envío, asignación y decisión actualizan esa revisión en su commit; revision del
    documento/envío/asignación se consulta por separado. No confundir number de versión documental.
  - COMMAND_IN_PROGRESS exige exclusión temporal por actor/operación/clave. DATA001 solo persiste
    recibos terminales; exclusión y referencia idempotente al analizador son diseño transaccional
    pendiente de verificación, no una tabla de tareas ya implementada. Huella de mismo cuerpo se
    exige contra recibos existentes; antes del commit no se afirma registro durable de intento.
  - "UC004: origin correction solo desde última decisión correction y estado correction;
    reconsideration solo desde última rejected y estado rejected, con motivo privado obligatorio. No
    aplica a suspensión/aprobación/archivo. Preparar no presenta impugnación."
  - Una nueva versión conserva expediente, número creciente, source_decision_id/source_submission_id
    exactos y última decisión sin sobrescribirla. Reenvío crea otro envío/decisión; no reeditar
    historial. Sin plazo de impugnación inventado.
  - D08-0.1 es propuesta, no política jurídica aprobada. C14=30 días; finalización administrativa
    explícita separada, sin plazo de impugnación. Registro de cambios/primer inicio preservado.
  - "D09 fuente propia: perfil operativo habilitado + concesión review vigente filtrados por envío;
    no Account.operator ni directorio M1. Bootstrap y personas reales pendientes."
  - "Contrato0.3.1: private_data_available=false exige proyección privada nula y declaración false;
    decisión visible tiene indicador propio. Finality provisional tras resolver; final solo por
    comando separado. Retention delete_pending se presenta delayed, nunca complete."
  - "Huellas: HMAC-SHA256 + JCS RFC8785, separación de dominios y hashKeyId servidor; acuerdo
    consumidor en INTEGRACION_Y_ENTREGA_M2_M8.md. No se cambia interfaz M1."
  - Alcance integral M2 UC001-011 y M8 UC001-005. Estados base de residencia/perfil separados de
    restricciones/isPaused; elegibilidad actual se calcula con eligibilityRevision monotónica.
  - Recibo Membership usa result_revision del expediente; recibo Community usa revisión del
    perfil/restricción/apelación que modifica la operación, declarada en su contrato. Ambas familias
    serializan actor+operación con anillo HMAC.
  - Datos contractuales del oferente no se copian de residencia ni se muestran públicamente; resumen
    privado solo comprador elegible por finalidad precontractual. No se habilitan pagos, ofertas M3
    ni tarifas.
