    idempotency: command_id unique in event reference under actor/action; same canonical input same
      event, different input conflict; store protected digest in internal journal, no private
      payload
    transaction: lock application -> cases sorted -> grants -> documents sorted -> links -> holds/tasks;
      revision and external ledger fencing; destructive step outside DB transaction but within
      resource exclusion
    status: designed_only
    result: event_id, case_id, resulting_revision, state; original event on replay, no private payload
