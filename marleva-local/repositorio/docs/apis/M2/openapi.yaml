  /v1/m2/membership-applications/{application_id}/uploads:
    post:
      operationId: MAR_M2_API_005
      tags:
        - M2
      summary: Reservar una carga privada
      description: CAS de expediente draft/versión. purpose debe corresponder a relación declarada. Máximo
        dos finalidades reservadas o enlazadas; reemplazo usa objeto nuevo, conserva anterior hasta
        enlace válido. Serializar cupo por expediente. Permiso de 300 s máximo desde creación, no se
        amplía en replay. Datos de permiso se regeneran reautorizando y no se guardan en recibo. Si
        venció, upload null, pedir carga nueva con clave nueva. No incluir nombre de archivo ni
        clave de objeto. También acepta borrador actual de correction/rejected según
        origin/antecedente vigente; mismo control de revisión/cupo. No reserva en versión enviada.
        Reemplazar solo enlace de borrador, sin eliminar evidencia anterior por este comando.
