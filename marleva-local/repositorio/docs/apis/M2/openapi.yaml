        title:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: integer
          enum:
            - 400
            - 401
            - 403
            - 404
            - 409
            - 413
            - 415
            - 422
            - 429
            - 503
        codigo:
          type: string
          enum:
            - MALFORMED_REQUEST
            - SESSION_REQUIRED
            - ACTION_FORBIDDEN
            - MFA_REQUIRED
            - RECENT_AUTH_REQUIRED
            - RESOURCE_NOT_FOUND
            - REVISION_CONFLICT
            - STATE_CONFLICT
            - ASSIGNMENT_LOST
            - IDEMPOTENCY_CONFLICT
            - COMMAND_IN_PROGRESS
            - PERMIT_EXPIRED
            - UPLOAD_EXPIRED
            - CONTENT_CONFLICT
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - VALIDATION_FAILED
            - DOCUMENT_NOT_READY
            - RATE_LIMITED
            - DEPENDENCY_UNAVAILABLE
            - DOCUMENT_NOT_REUSABLE
        mensaje:
          type: string
          minLength: 1
          maxLength: 300
        request_id:
          type: string
          format: uuid
        accion_recuperacion:
          type: string
          enum:
            - authenticate_m1
            - verify_mfa_m1
            - reauthenticate_m1
            - reload_resource
            - correct_fields
            - replace_document
            - request_new_permit
            - retry_same_command
            - wait_then_retry
            - contact_support
        errores_campos:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              campo:
                $ref: "#/components/schemas/CorrectionField"
              codigo:
                type: string
                enum:
                  - required
                  - invalid
                  - expired
                  - future_date
                  - not_ready
                  - mismatch
            required:
              - campo
              - codigo
          maxItems: 9
      required:
        - type
        - title
        - status
        - codigo
        - mensaje
        - request_id
        - accion_recuperacion
      examples:
        - type: about:blank
          title: Conflicto de versión
          status: 409
          codigo: REVISION_CONFLICT
          mensaje: El expediente cambió. Consulta la versión actual.
          request_id: 00000000-0000-4000-8000-000000000007
          accion_recuperacion: reload_resource
