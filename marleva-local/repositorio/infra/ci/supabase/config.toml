project_id = "marleva-ci"

[api]
enabled = true
port = 54621
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54622
shadow_port = 54620
major_version = 17
health_timeout = "2m"

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true
port = 54624
smtp_port = 54625

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "https://localhost:8443"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.rate_limit]
email_sent = 1000
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Código de acceso Marleva local"
content_path = "./supabase/templates/otp.html"

[auth.email.template.confirmation]
subject = "Código de acceso Marleva local"
content_path = "./supabase/templates/otp.html"

[auth.email.template.email_change]
subject = "Cambio de correo Marleva local"
content_path = "./supabase/templates/otp.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = false

[analytics]
enabled = false
