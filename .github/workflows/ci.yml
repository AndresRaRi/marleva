name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: marleva-local/repositorio
jobs:
  calidad:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Comprobar calidad
        run: pnpm ci:run calidad
      - name: Resumen para revisión
        if: always()
        run: node scripts/ci-summary.mjs calidad '${{ job.status }}'
  arquitectura-contratos:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Comprobar arquitectura-contratos
        run: pnpm ci:run arquitectura-contratos
      - name: Resumen para revisión
        if: always()
        run: node scripts/ci-summary.mjs arquitectura-contratos '${{ job.status }}'
  unitarias:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Comprobar unitarias
        run: pnpm ci:run unitarias
      - name: Resumen para revisión
        if: always()
        run: node scripts/ci-summary.mjs unitarias '${{ job.status }}'
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [calidad, arquitectura-contratos, unitarias]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Comprobar build
        run: pnpm ci:run build
      - name: Resumen para revisión
        if: always()
        run: node scripts/ci-summary.mjs build '${{ job.status }}'
