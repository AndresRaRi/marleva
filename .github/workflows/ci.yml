name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    working-directory: marleva-local/repositorio
jobs:
  calidad:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Comprobar calidad
        run: pnpm ci:run calidad
      - name: Resumen para revisión
        if: always()
        run: node scripts/ci-summary.mjs calidad '${{ job.status }}'
  arquitectura-contratos:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Comprobar arquitectura-contratos
        run: pnpm ci:run arquitectura-contratos
      - name: Resumen para revisión
        if: always()
        run: node scripts/ci-summary.mjs arquitectura-contratos '${{ job.status }}'
  unitarias:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Comprobar unitarias
        run: pnpm ci:run unitarias
      - name: Conservar cobertura general
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: coverage-general-${{ github.sha }}
          path: |
            marleva-local/repositorio/coverage/lcov.info
            marleva-local/repositorio/coverage/coverage-summary.json
          retention-days: 3
          if-no-files-found: error
      - name: Resumen para revisión
        if: always()
        run: node scripts/ci-summary.mjs unitarias '${{ job.status }}'
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - calidad
      - arquitectura-contratos
      - unitarias
      - seguridad
      - integracion
      - contrato
      - sonar
      - web
      - codeql
      - cobertura
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Comprobar build
        run: pnpm ci:run build
      - name: Resumen para revisión
        if: always()
        run: node scripts/ci-summary.mjs build '${{ job.status }}'
  seguridad:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Analizar dependencias, secretos, licencias y SBOM
        run: pnpm ci:run seguridad
      - name: Guardar evidencia sin credenciales
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: seguridad
          path: marleva-local/repositorio/artifacts/security/
          retention-days: 3
          if-no-files-found: error
      - name: Resumen para revisión
        if: always()
        run: node scripts/ci-summary.mjs seguridad '${{ job.status }}'
  integracion:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs:
      - calidad
      - arquitectura-contratos
      - unitarias
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Preparar servicios CI aislados
        run: pnpm ci:stack:start
      - name: Verificar migraciones desde cero y versión anterior
        run: pnpm ci:migrations
      - name: Ejecutar comprobaciones reales
        run: pnpm ci:run integracion
      - name: Guardar evidencia sin credenciales
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: integracion
          path: |-
            marleva-local/repositorio/tests/results/ci-integration-backend.json
            marleva-local/repositorio/tests/results/ci-migrations.json
            marleva-local/repositorio/tests/results/ci-operators*.json
          retention-days: 3
          if-no-files-found: error
      - name: Detener únicamente el stack de ensayo
        if: always()
        run: pnpm ci:stack:stop
      - name: Resumen para revisión
        if: always()
        run: node scripts/ci-summary.mjs integracion '${{ job.status }}'
  contrato:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs:
      - calidad
      - arquitectura-contratos
      - unitarias
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: marleva-local/repositorio/infra/ci/.python-version
          cache: pip
          cache-dependency-path: marleva-local/repositorio/infra/ci/requirements.lock
      - name: Preparar servicios CI aislados
        run: pnpm ci:stack:start
      - name: Verificar migraciones desde cero y versión anterior
        run: pnpm ci:migrations
      - name: Ejecutar comprobaciones reales
        run: pnpm ci:run contrato
      - name: Guardar evidencia sin credenciales
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: contrato
          path: marleva-local/repositorio/artifacts/ci/schemathesis/
          retention-days: 3
          if-no-files-found: error
      - name: Detener únicamente el stack de ensayo
        if: always()
        run: pnpm ci:stack:stop
      - name: Resumen para revisión
        if: always()
        run: node scripts/ci-summary.mjs contrato '${{ job.status }}'
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs:
      - calidad
      - arquitectura-contratos
      - unitarias
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Preparar servicios CI aislados
        run: pnpm ci:stack:start
      - name: Verificar migraciones desde cero y versión anterior
        run: pnpm ci:migrations
      - name: Instalar Chromium de Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Confiar en CA temporal del runner
        run: pnpm ci:cert-trust
      - name: Ejecutar comprobaciones reales
        run: pnpm ci:run web
      - name: Guardar evidencia sin credenciales
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: web
          path: |-
            marleva-local/repositorio/artifacts/ci/capturas/
            marleva-local/repositorio/artifacts/ci/axe.json
            marleva-local/repositorio/artifacts/ci/lighthouse/
          retention-days: 3
          if-no-files-found: error
      - name: Detener únicamente el stack de ensayo
        if: always()
        run: pnpm ci:stack:stop
      - name: Resumen para revisión
        if: always()
        run: node scripts/ci-summary.mjs web '${{ job.status }}'
  revision-dependencias:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: low
      - name: Resumen para revisión
        if: always()
        run: node scripts/ci-summary.mjs revision-dependencias '${{ job.status }}'
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: github/codeql-action/init@f3c49fd1ef3281abc41069b3dd22807a60c963f6
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6
      - name: Resumen para revisión
        if: always()
        run: node scripts/ci-summary.mjs codeql '${{ job.status }}'

  m3:
    uses: ./.github/workflows/m3.yml
  cobertura:
    needs: [unitarias, m3]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Recuperar cobertura del mismo run y SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name "coverage-general-$GITHUB_SHA" --dir coverage
          gh run download "$GITHUB_RUN_ID" --name "m3-$GITHUB_SHA" --dir artifacts/ci/m3-evidence
      - name: Evaluar línea base y código nuevo con cobertura agregada
        run: |
          export MARLEVA_COVERAGE_BASE="$(git merge-base HEAD origin/main)"
          export MARLEVA_COVERAGE_EXTRA=artifacts/ci/m3-evidence/coverage/m3-full/lcov.info
          pnpm coverage:check
  sonar:
    permissions:
      contents: read
      actions: read
    concurrency:
      group: sonar-cloud-andresrari-marleva
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [calidad, arquitectura-contratos, unitarias, m3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Generar LCOV del cambio para Sonar
        run: pnpm test:coverage
      - name: Incorporar cobertura M3 del mismo run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name "m3-$GITHUB_SHA" --dir artifacts/ci/m3-evidence
          cat artifacts/ci/m3-evidence/coverage/m3-full/lcov.info >> coverage/lcov.info
      - name: Sonar Cloud privado con negativa y corrección reales
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          SONAR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
          SONAR_HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: pnpm ci:run sonar
      - name: Guardar resumen sin credenciales
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: sonar-cloud-summary
          path: |
            marleva-local/repositorio/artifacts/ci/sonar-cloud/*/summary.json
            marleva-local/repositorio/artifacts/ci/sonar-cloud/*/evidence.enc
          retention-days: 7
      - name: Resumen para revisión
        if: always()
        run: node scripts/ci-summary.mjs sonar '${{ job.status }}'
